name: docs

on:
  workflow_dispatch:
  schedule:
    - cron: "00 15 * * *"
  repository_dispatch:
    types: deploy-docs

jobs:
  build:
    name: Deploy to now branch
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        ref: 'master'
        submodules: 'recursive'
    - run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        # GitHub's default branch is `notice` (move README only; no `data/`).
        # The dataset lives on Codeberg `main` (same tree as the archived GitHub `main`).
        git clone --depth 1 --branch main https://codeberg.org/jplatte/caniuse.rs.git /tmp/caniuse
        git clone --depth 1 https://github.com/nrc/rfc-index.git /tmp/rfcs
    - name: Deloy docs
      run: ./scripts/deploy-docs.sh
